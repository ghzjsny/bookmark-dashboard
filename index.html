<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书签导航</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="wall-overlay" id="wall-overlay"></div>

  <aside id="sidebar" class="sidebar"></aside>

  <header class="topbar">
    <div class="clock" id="clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">----年--月--日 星期-</div>
    </div>

    <div class="search-area">
      <div class="search-wrap">
        <button id="engine-btn" class="engine-btn" title="选择搜索引擎" aria-expanded="false">
          <span class="engine-ico" id="engine-ico"></span>
          <svg class="engine-caret" viewBox="0 0 24 24" width="10" height="10"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
        <input id="search" type="text" placeholder="输入搜索内容（Ctrl+K 快速聚焦）" autocomplete="off" />
        <button id="search-clear" class="search-clear" title="清空" aria-label="清空">×</button>
      </div>
      <div id="engine-panel" class="engine-panel hidden">
        <div id="engine-grid" class="engine-grid"></div>
      </div>
    </div>
  </header>

  <main id="content" class="content">
    <div id="loading" class="loading">正在读取书签…</div>
  </main>

  <div id="dock" class="dock"></div>

  <button id="about-toggle" class="icon-btn about-toggle" title="关于 · 请作者喝杯咖啡" aria-label="关于与打赏">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>
  </button>

  <button id="settings-toggle" class="icon-btn gear" title="设置" aria-label="设置">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.34.61.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7.03 7.03 0 0 0 1.62-.94l2.39.96c.23.09.47 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6z"/></svg>
  </button>

  <button id="edit-toggle" class="icon-btn edit-toggle" title="编辑模式（开启后书签与文件夹显示编辑/删除按钮）" aria-label="编辑模式" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  </button>

  <button id="back-top" class="icon-btn back-top" title="返回顶部" aria-label="返回顶部">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
  </button>

  <button id="zen-toggle" class="icon-btn zen-toggle" title="清爽模式" aria-label="清爽模式">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6.05 8.05c-2.73 2.73-2.73 7.16 0 9.89.21.21.44.4.68.56 1.47-3.4 4.1-6.25 7.37-7.94-2.78 2.35-4.72 5.62-5.4 9.34 2.6 1.23 5.8.78 7.95-1.37C20.12 15.06 20 4 20 4S9.53 4.57 6.05 8.05z"/></svg>
  </button>

  <!-- 设置面板 -->
  <div id="settings" class="modal hidden">
    <div class="settings-card">
      <div class="settings-head">
        <span>设置</span>
        <button id="s-close" class="search-clear show" title="关闭">×</button>
      </div>
      <div class="settings-body">
        <section>
          <h4>搜索引擎 <span class="hint">点击设为默认，回车即用该引擎搜索</span></h4>
          <div id="engine-list"></div>
          <div class="engine-add">
            <input id="e-name" type="text" placeholder="名称" />
            <input id="e-url" type="text" placeholder="网址（含 %s，如 https://cn.bing.com/search?q=%s）" />
            <button id="e-add" class="btn primary">添加</button>
          </div>
        </section>

        <section>
          <h4>背景壁纸</h4>
          <div class="row">
            <button id="s-wp-upload" class="btn ghost">上传图片</button>
            <button id="s-wp-clear" class="btn ghost">恢复默认背景</button>
          </div>
          <label class="slider-row">
            <span>蒙版深度</span>
            <input id="s-mask" type="range" min="0" max="100" />
            <span id="s-mask-val" class="mask-val">0</span>
          </label>
        </section>

        <section>
          <h4>显示方式</h4>
          <div class="seg" id="s-layout">
            <button data-v="classic">经典</button>
            <button data-v="waterfall">瀑布式</button>
          </div>
        </section>

        <section>
          <h4>主题</h4>
          <div class="seg" id="s-theme">
            <button data-v="light">浅色</button>
            <button data-v="dark">深色</button>
          </div>
        </section>

        <section>
          <h4>显示项</h4>
          <label class="switch-row">
            <span>显示「常用书签」「最近访问」</span>
            <input type="checkbox" id="s-show-smart" class="switch" />
          </label>
          <label class="switch-row">
            <span>显示底部快捷栏（Dock）</span>
            <input type="checkbox" id="s-show-dock" class="switch" />
          </label>
          <label class="switch-row">
            <span>Dock 栏显示「经常访问」</span>
            <input type="checkbox" id="s-show-freq" class="switch" />
          </label>
          <label class="switch-row">
            <span>显示左下角「关于 / 打赏」按钮</span>
            <input type="checkbox" id="s-show-about" class="switch" />
          </label>
          <label class="switch-row">
            <span>书签栏自动隐藏（鼠标移入滑出，移开收起）</span>
            <input type="checkbox" id="s-auto-hide" class="switch" />
          </label>
        </section>

        <section>
          <h4>图标 <span class="hint">预加载所有站点 favicon，下次打开无需逐个等待</span></h4>
          <button id="s-prefetch" class="btn ghost">一键获取全部书签图标</button>
          <div class="seg" id="s-noicon" title="未获取到真实图标的书签显示方式">
            <button data-v="globe">无图标显示地球</button>
            <button data-v="letter">无图标显示首字</button>
          </div>
        </section>

        <section>
          <h4>链接检测 <span class="hint">检测书签是否仍可访问，失效的会在磁贴标红</span></h4>
          <button id="s-check" class="btn ghost">一键检测所有链接是否可用</button>
        </section>
      </div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">编辑书签</div>
      <label class="field">
        <span>名称</span>
        <input id="m-title" type="text" placeholder="显示名称" />
      </label>
      <label class="field" id="m-url-field">
        <span>网址</span>
        <input id="m-url" type="text" placeholder="https://..." />
      </label>
      <div class="modal-actions">
        <button id="m-cancel" class="btn ghost">取消</button>
        <button id="m-save" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 关于 / 打赏 -->
  <div id="about" class="modal hidden">
    <div class="modal-card about-card">
      <div class="modal-title">请作者喝杯咖啡 ☕</div>
      <div class="about-grid">
        <div class="about-item">
          <div class="about-qr"><img src="assets/qrcode_boboqingcai.jpg" alt="微信公众号二维码" /></div>
          <div class="about-name">微信公众号</div>
          <div class="about-hint">扫码关注，不错过更新</div>
        </div>
        <div class="about-item">
          <div class="about-qr"><img src="assets/qrcode_nicecatch.cn.png" alt="网站二维码" /></div>
          <div class="about-name">我的网站</div>
          <a class="about-link" href="https://nicecatch.cn" target="_blank" rel="noopener">nicecatch.cn ↗ 点击访问</a>
        </div>
        <div class="about-item donate">
          <div class="about-qr"><img src="assets/donate_wechat.png" alt="微信收款码" /></div>
          <div class="about-name">微信支付</div>
          <div class="about-hint">鼠标悬停看大图 · 扫码请我喝杯咖啡</div>
        </div>
        <div class="about-item donate">
          <div class="about-qr"><img src="assets/donate_alipay.png" alt="支付宝收款码" /></div>
          <div class="about-name">支付宝</div>
          <div class="about-hint">鼠标悬停看大图 · 扫码请我喝杯咖啡</div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="about-close" class="btn ghost">关闭</button>
      </div>
    </div>
  </div>

  <!-- 收款码悬停放大弹层 -->
  <div id="qr-zoom" class="qr-zoom hidden"><img id="qr-zoom-img" alt="二维码大图" /></div>

  <!-- 清爽模式（叶子图标切换）：壁纸 + 居中搜索 + 固定/常访问图标 -->
  <div id="zen" class="zen hidden">
    <div class="zen-search-wrap">
      <svg class="zen-search-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="zen-search" class="zen-search" type="text" placeholder="输入搜索内容" autocomplete="off" />
    </div>
    <div id="zen-grid" class="zen-grid"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <input type="file" id="wp-file" accept="image/*" hidden />

  <!-- 失效链接报告 -->
  <div id="link-report" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title" id="link-report-title">失效链接</div>
      <div id="link-report-body" class="report-body"></div>
      <div class="modal-actions">
        <button id="lr-close" class="btn ghost">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/pinyin-initials.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
